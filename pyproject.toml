[project]
name = "sparkle"
version = "0.1.0"
description = "Claim-graph research MVP with content-addressed provenance"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{ name = "Albert Orlando" }]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
# Phase 1a MCP substrate: thin adapter over ops.py exposed via the MCP Python SDK.
# The zero-dependency core stays clean; this dependency only loads when the extra is installed.
mcp = ["mcp>=1.12,<2"]

[project.scripts]
sparkle = "sparkle.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
